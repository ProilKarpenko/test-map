<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Геокодер 2ГИС</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 300px; padding: 8px; }
        button { padding: 8px 15px; cursor: pointer; }
        #result { margin-top: 20px; font-weight: bold; white-space: pre-line; }
    </style>
</head>
<body>

    <h2>Прямое геокодирование 2ГИС</h2>

    <div class="form-group">
        <label for="apiKey">API Ключ 2ГИС:</label>
        <input type="text" id="apiKey" placeholder="api key">
    </div>

    <div class="form-group">
        <label for="address">Адрес для поиска:</label>
        <input type="text" id="address" value="Москва, Красная площадь, 1">
    </div>

    <button onclick="geocodeAddress()">Найти координаты</button>

    <div id="result"></div>

    <script>
        async function geocodeAddress() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const address = document.getElementById('address').value.trim();
            const resultDiv = document.getElementById('result');

            if (!apiKey) {
                resultDiv.innerText = 'Пожалуйста, введите API-ключ.';
                return;
            }

            resultDiv.innerText = 'Поиск...';

            const encodedAddress = encodeURIComponent(address);
            const encodedKey = encodeURIComponent(apiKey);
            const url = `https://2gis.com{encodedAddress}&fields=items.point&key=${encodedKey}`;

            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`Ошибка HTTP: ${response.status}`);
                }

                const data = await response.json();

                if (data.result && data.result.items && data.result.items.length > 0) {
                    const firstItem = data.result.items[0];
                    
                    if (firstItem.point) {
                        const lon = firstItem.point.lon;
                        const lat = firstItem.point.lat;

                        resultDiv.innerText = `Найдено:\nШирота (Lat): ${lat}\nДолгота (Lon): ${lon}`;
                    } else {
                        resultDiv.innerText = 'Объект найден, но у него нет точных координат.';
                    }
                } else {
                    resultDiv.innerText = 'Адрес не найден. Проверьте правильность написания.';
                }
            } catch (error) {
                resultDiv.innerText = `Ошибка при запросе: ${error.message}`;
            }
        }
    </script>
</body>
</html>
